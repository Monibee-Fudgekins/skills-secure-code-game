version: 2
updates:
  # Was github-actions monthly only; the requirements.txt (pip) deps
  # were not covered at all.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "security"]
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "security"]
    cooldown:
      default-days: 7
