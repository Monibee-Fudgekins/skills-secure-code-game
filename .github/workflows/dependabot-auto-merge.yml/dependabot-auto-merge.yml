name: Dependabot auto-merge

# Owner decision: Dependabot patch + minor updates merge with no human review once
# CI is green; majors are labelled for manual review. With the 7-day cooldown in
# .github/dependabot.yml, nothing is proposed until it has been public for a week.
#
# Why this waits for CI itself instead of `gh pr merge --auto`: main has no required
# status checks, so GitHub auto-merge would merge immediately, before any check ran.
# This job polls every OTHER check run and commit status on the PR head and merges
# only when all of them have finished green. Any failure, or a 40-minute timeout,
# leaves the PR open for a human. It never approves: main does not require one.

on: pull_request

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.actor == 'dependabot[bot]'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SELF_CHECK: Auto-merge Dependabot PRs
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0 — pinned to a commit (third-party action with write access)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Major version bumps get a label for manual review (never auto-merged).
      - name: Label major updates for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh label create "major-update" --color "e11d48" --description "Major version bump — needs manual review" --force
          gh label create "needs-review" --color "f59e0b" --description "Needs manual review before merging" --force
          gh pr edit "$PR_URL" --add-label "major-update,needs-review"

      - name: Wait for every other check, then merge (patch + minor only)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          set -euo pipefail
          # Give the other workflows and external apps time to register.
          sleep 60
          deadline=$(( $(date +%s) + 40 * 60 ))
          while :; do
            runs="$(gh api --paginate "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq ".check_runs[] | select(.name != env.SELF_CHECK) | [.name, .status, (.conclusion // "")] | @tsv")"
            statuses="$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/status" \
              --jq '.statuses[] | [.context, .state] | @tsv')"
            pending=0; failed=""
            while IFS=$'\t' read -r name status conclusion; do
              [ -n "$name" ] || continue
              if [ "$status" != "completed" ]; then pending=$((pending + 1)); continue; fi
              case "$conclusion" in
                success|skipped|neutral) ;;
                *) failed="$failed\n  check: $name ($conclusion)" ;;
              esac
            done <<< "$runs"
            while IFS=$'\t' read -r ctx state; do
              [ -n "$ctx" ] || continue
              case "$state" in
                success) ;;
                pending) pending=$((pending + 1)) ;;
                *) failed="$failed\n  status: $ctx ($state)" ;;
              esac
            done <<< "$statuses"
            if [ -n "$failed" ]; then
              echo -e "::warning::not merging — failing checks:$failed"
              exit 0
            fi
            if [ "$pending" -eq 0 ]; then break; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::not merging — $pending check(s) still pending after 40 min"
              exit 0
            fi
            echo "waiting on $pending check(s)…"
            sleep 30
          done
          # Merge only the exact commit that was checked.
          gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA"
