name: Auto-merge

# Owner decision (2026-11-26): EVERYTHING merges automatically once CI is green —
# Dependabot patch, minor AND major updates, plus release-please release PRs.
# Nothing is held for manual review. With the 7-day cooldown in
# .github/dependabot.yml, nothing is proposed until it has been public for a week.
#
# Why this waits for CI itself instead of `gh pr merge --auto`: main has no required
# status checks, so GitHub auto-merge would merge immediately, before any check ran.
# This job polls every OTHER check run and commit status on the PR head and merges
# only when all of them have finished green. Any failure, or a 40-minute timeout,
# leaves the PR open for a human. It never approves: main does not require one.

on: pull_request

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      (github.event.pull_request.user.login == 'github-actions[bot]' &&
       startsWith(github.event.pull_request.title, 'chore(main): release'))
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SELF_CHECK: Auto-merge
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0 — pinned to a commit (third-party action with write access)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for every other check, then merge
        run: |
          set -euo pipefail
          # Give the other workflows and external apps time to register.
          sleep 60
          deadline=$(( $(date +%s) + 40 * 60 ))
          while :; do
            runs="$(gh api --paginate "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq ".check_runs[] | select(.name != env.SELF_CHECK) | [.name, .status, (.conclusion // \"\")] | @tsv")"
            statuses="$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/status" \
              --jq '.statuses[] | [.context, .state] | @tsv')"
            pending=0; failed=""
            while IFS=$'\t' read -r name status conclusion; do
              [ -n "$name" ] || continue
              if [ "$status" != "completed" ]; then pending=$((pending + 1)); continue; fi
              case "$conclusion" in
                success|skipped|neutral) ;;
                *) failed="$failed\n  check: $name ($conclusion)" ;;
              esac
            done <<< "$runs"
            while IFS=$'\t' read -r ctx state; do
              [ -n "$ctx" ] || continue
              case "$state" in
                success) ;;
                pending) pending=$((pending + 1)) ;;
                *) failed="$failed\n  status: $ctx ($state)" ;;
              esac
            done <<< "$statuses"
            if [ -n "$failed" ]; then
              echo -e "::warning::not merging — failing checks:$failed"
              exit 0
            fi
            if [ "$pending" -eq 0 ]; then break; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::not merging — $pending check(s) still pending after 40 min"
              exit 0
            fi
            echo "waiting on $pending check(s)…"
            sleep 30
          done
          # Merge only the exact commit that was checked.
          gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA"
